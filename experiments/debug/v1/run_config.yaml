!!python/object:__main__.EgoAlloTrainConfig
batch_size: 256
dataset_files_path: !!python/object/apply:pathlib.PosixPath
- /
- nvmessd
- ssd_share
- tengbo
- egoallo
- data
- egoalgo_no_skating_dataset_files.txt
dataset_hdf5_path: !!python/object/apply:pathlib.PosixPath
- /
- nvmessd
- ssd_share
- tengbo
- egoallo
- data
- egoalgo_no_skating_dataset.hdf5
dataset_slice_random_variable_len_proportion: 0.3
dataset_slice_strategy: random_uniform_len
experiment_name: debug
learning_rate: 0.0001
loss: !!python/object:egoallo.training_loss.TrainingLossConfig
  beta_coeff_weights: !!python/tuple
  - 1.0
  - 0.5
  - 0.3333333333333333
  - 0.25
  - 0.2
  - 0.16666666666666666
  - 0.14285714285714285
  - 0.125
  - 0.1111111111111111
  - 0.1
  - 0.09090909090909091
  - 0.08333333333333333
  - 0.07692307692307693
  - 0.07142857142857142
  - 0.06666666666666667
  - 0.0625
  cond_dropout_prob: 0.0
  loss_weights:
    betas: 0.1
    body_rotmats: 1.0
    contacts: 0.1
    hand_rotmats: 0.01
  weight_loss_by_t: emulate_eps_pred
max_grad_norm: 1.0
model: !!python/object:egoallo.network.EgoDenoiserConfig
  activation: gelu
  cond_param: ours
  d_feedforward: 2048
  d_latent: 512
  d_noise_emb: 1024
  decoder_layers: 6
  dropout_p: 0.0
  encoder_layers: 6
  fourier_enc_freqs: 3
  include_canonicalized_cpf_rotation_in_cond: true
  include_hand_positions_cond: false
  include_hands: true
  max_t: 1000
  noise_conditioning: token
  num_heads: 4
  positional_encoding: rope
  xattn_mode: kv_from_cond_q_from_x
num_workers: 2
subseq_len: 128
train_splits: !!python/tuple
- train
- val
warmup_steps: 1000
weight_decay: 0.0001
